resources:
  jobs:
    chunking_strategies_job:
      name: chunking-strategies
      tags:
        project_name: "llmops-databricks-course-grajee"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: chunking_strategies
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/2.3_chunking_strategies.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
