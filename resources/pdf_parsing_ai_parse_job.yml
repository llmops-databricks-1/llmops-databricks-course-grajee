resources:
  jobs:
    pdf_parsing_ai_parse_job:
      name: pdf-parsing-ai-parse
      tags:
        project_name: "llmops-databricks-course-grajee"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: pdf_parsing_ai_parse
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/2.2_pdf_parsing_ai_parse.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
